# Central-only overrides (merged on top of tp-sofle.conf).

# The central has no keys, so nothing could wake it from deep sleep.
CONFIG_ZMK_SLEEP=n

# Trackball sensitivity, same starting point as the Charybdis.
# Effective CPI = CONFIG_PMW3360_CPI / CONFIG_PMW3360_CPI_DIVIDOR.
CONFIG_PMW3360_CPI=800
CONFIG_PMW3360_CPI_DIVIDOR=1

# Throttle motion reports to ~100 Hz so the BLE link to the host isn't flooded
# (skayred driver fork, see config/west.yml).
CONFIG_PMW3360_REPORT_RATE_MS=10

# Sensor orientation depends on how the sensor is mounted; set once it's built.
# CONFIG_PMW3360_ORIENTATION_90=y
# CONFIG_PMW3360_INVERT_X=y
